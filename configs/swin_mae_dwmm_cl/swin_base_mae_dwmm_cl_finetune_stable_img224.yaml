MODEL:
  TYPE: swin_mae_dwmm_cl
  NAME: swin_base_mae_dwmm_cl_finetune
  NUM_CLASSES: 2
  DROP_RATE: 0.10
  DROP_PATH_RATE: 0.10
  ATTN_DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.05
  RESUME: ""

  SWIN:
    PATCH_SIZE: 4
    IN_CHANS: 3
    EMBED_DIM: 128
    DEPTHS:
      - 2
      - 2
      - 18
      - 2
    NUM_HEADS:
      - 4
      - 8
      - 16
      - 32
    WINDOW_SIZE: 7
    MLP_RATIO: 4.0
    QKV_BIAS: true
    QK_SCALE: null
    APE: false
    PATCH_NORM: true
    DEFORMABLE_OFFSET_SCALE: 1.0

DATA:
  BATCH_SIZE: 16
  DATA_PATH: ""
  DATASET: imagenet
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  NUM_WORKERS: 8
  PIN_MEMORY: true
  LOSO_SUBJECT: subject13

TRAIN:
  START_EPOCH: 0
  EPOCHS: 100
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05

  # Direct fine-tuning LR; no SimMIM global-batch /512 scaling.
  BASE_LR: 0.00005
  WARMUP_LR: 0.000001
  MIN_LR: 0.0000005

  CLIP_GRAD: 2.0
  AUTO_RESUME: false
  ACCUMULATION_STEPS: 2
  USE_CHECKPOINT: false

  LR_SCHEDULER:
    NAME: cosine
    DECAY_EPOCHS: 30
    DECAY_RATE: 0.1
    GAMMA: 0.1
    MULTISTEPS: []

  OPTIMIZER:
    NAME: adamw
    EPS: 0.00000001
    BETAS:
      - 0.9
      - 0.999
    MOMENTUM: 0.9

AUG:
  COLOR_JITTER: 0.20
  AUTO_AUGMENT: rand-m5-mstd0.5-inc1
  REPROB: 0.10
  REMODE: pixel
  RECOUNT: 1

  MIXUP: 0.10
  MIXUP_PROB: 0.50
  MIXUP_SWITCH_PROB: 0.50
  MIXUP_MODE: batch
  CUTMIX: 0.0
  CUTMIX_MINMAX: null

TEST:
  CROP: true

AMP_OPT_LEVEL: O0
OUTPUT: output
TAG: swin_base_mae_dwmm_cl_100ep
SAVE_FREQ: 5
PRINT_FREQ: 100
SEED: 0
EVAL_MODE: false
THROUGHPUT_MODE: false
LOCAL_RANK: 0
