MODEL:
  TYPE: deit
  NAME: deit_base_patch16_224_finetune
  NUM_CLASSES: 2

  DROP_RATE: 0.35
  DROP_PATH_RATE: 0.25
  LABEL_SMOOTHING: 0.25
  RESUME: ""

DATA:
  BATCH_SIZE: 32
  DATA_PATH: ""
  DATASET: imagenet
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  NUM_WORKERS: 8
  PIN_MEMORY: true
  LOSO_SUBJECT: subject13

TRAIN:
  START_EPOCH: 0
  EPOCHS: 100
  WARMUP_EPOCHS: 5

  WEIGHT_DECAY: 0.15

  BASE_LR: 0.00003
  WARMUP_LR: 0.0000003
  MIN_LR: 0.000000003

  CLIP_GRAD: 2.0

  AUTO_RESUME: false
  ACCUMULATION_STEPS: 0
  USE_CHECKPOINT: false

  LR_SCHEDULER:
    NAME: cosine
    DECAY_EPOCHS: 30
    DECAY_RATE: 0.1
    GAMMA: 0.1
    MULTISTEPS: []

  OPTIMIZER:
    NAME: adamw
    EPS: 0.00000001
    BETAS:
      - 0.9
      - 0.999
    MOMENTUM: 0.9

AUG:
  COLOR_JITTER: 0.45
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.35
  REMODE: pixel
  RECOUNT: 1

  MIXUP: 0.45
  MIXUP_PROB: 0.8
  MIXUP_SWITCH_PROB: 0.5
  MIXUP_MODE: batch

  CUTMIX: 0.45
  CUTMIX_MINMAX: null

TEST:
  CROP: true

AMP_OPT_LEVEL: O0

OUTPUT: output
TAG: deit_base_100ep

SAVE_FREQ: 5
PRINT_FREQ: 100

SEED: 0

EVAL_MODE: false
THROUGHPUT_MODE: false
LOCAL_RANK: 0
